<text class="m" x="24" y="57" font-size="12.5">total speedup = fewer search nodes × less time per node (threads, layout, kernels) · vs trie + masks · log scale</text>
<text class="m" x="24" y="74" font-size="11">nodes = cells visited by the kernel; a few steps changed what one node is (e.g. leaves counted in bulk), so read the split as approximate</text>
