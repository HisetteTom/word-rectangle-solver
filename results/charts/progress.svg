<text class="t" x="24" y="38" font-size="22" font-weight="800">Word rectangle solver · how fast it got</text>
<text class="m" x="24" y="60" font-size="12.5">every optimization step, re-run on one machine · hephaestus · Ryzen 9 3950X · 16 cores / 32 threads</text>
