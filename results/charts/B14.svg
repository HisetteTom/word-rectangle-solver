<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
  .bg{fill:#ffffff} .t{fill:#1f2328} .m{fill:#59636e} .g{stroke:#d1d9e0}
  .bar{fill:#8fb8de} .best{fill:#1f6feb} .x{fill:#1a7f37;font-weight:600}
  .fail{fill:url(#hatch)} .hs{stroke:#afb8c1} .hb{fill:#eaeef2} .f{fill:#cf222e;font-weight:600}
  .ft{fill:#8c959f} .cur{fill:#1f6feb;font-weight:700}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .t{fill:#e6edf3} .m{fill:#9198a1} .g{stroke:#30363d}
    .bar{fill:#2f5f8f} .best{fill:#4493f8} .x{fill:#3fb950}
    .hs{stroke:#484f58} .hb{fill:#21262d} .f{fill:#f85149} .ft{fill:#6e7681} .cur{fill:#4493f8}
  }
</style>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hb" width="6" height="6"/><line class="hs" x1="0" y1="0" x2="0" y2="6" stroke-width="2.5"/></pattern></defs>
<rect class="bg" width="860" height="300" rx="8"/>
<text class="t" x="20" y="30" font-size="17" font-weight="700">B14 · count all 6×4 (exhaustive)</text>
<text class="m" x="20" y="50" font-size="12">search time · shorter is better · speedup vs B14 baseline (tall count) · hatched = failed experiment, reverted</text>
<line class="g" x1="230.0" x2="230.0" y1="60" y2="272" stroke-dasharray="2 3"/>
<text class="m" x="230.0" y="288" font-size="11" text-anchor="middle">0</text>
<line class="g" x1="356.7" x2="356.7" y1="60" y2="272" stroke-dasharray="2 3"/>
<text class="m" x="356.7" y="288" font-size="11" text-anchor="middle">5 s</text>
<line class="g" x1="483.3" x2="483.3" y1="60" y2="272" stroke-dasharray="2 3"/>
<text class="m" x="483.3" y="288" font-size="11" text-anchor="middle">10 s</text>
<line class="g" x1="610.0" x2="610.0" y1="60" y2="272" stroke-dasharray="2 3"/>
<text class="m" x="610.0" y="288" font-size="11" text-anchor="middle">15 s</text>
<text class="t" x="218" y="79.0" font-size="13" font-weight="600" text-anchor="end">B14 baseline (tall count)</text>
<text class="m" x="218" y="93.0" font-size="10" text-anchor="end">c539608 · fast</text>
<rect class="bar" x="230" y="66" width="362.0" height="24" rx="3"/>
<text class="t" x="600.0" y="82.0" font-size="13">14.3 s<tspan class="m" dx="8">baseline</tspan></text>
<text class="t" x="218" y="119.0" font-size="13" font-weight="600" text-anchor="end">tall grids transposed</text>
<text class="m" x="218" y="133.0" font-size="10" text-anchor="end">e9dd7bb · fast</text>
<rect class="bar" x="230" y="106" width="144.1" height="24" rx="3"/>
<text class="t" x="382.1" y="122.0" font-size="13">5.69 s<tspan class="x" dx="8">2.51× faster</tspan></text>
<text class="ft" x="218" y="159.0" font-size="13" font-weight="600" text-anchor="end">paired last two rows (failed)</text>
<text class="m" x="218" y="173.0" font-size="10" text-anchor="end">864443e · fast</text>
<rect class="fail" x="230" y="146" width="175.9" height="24" rx="3"/>
<text class="ft" x="413.9" y="162.0" font-size="13">6.94 s<tspan class="m" dx="8">2.06× faster</tspan><tspan class="f" dx="8">✗ reverted</tspan></text>
<text class="ft" x="218" y="199.0" font-size="13" font-weight="600" text-anchor="end">backward next-row bound (failed)</text>
<text class="m" x="218" y="213.0" font-size="10" text-anchor="end">7901ad2 · fast</text>
<rect class="fail" x="230" y="186" width="145.9" height="24" rx="3"/>
<text class="ft" x="383.9" y="202.0" font-size="13">5.76 s<tspan class="m" dx="8">2.48× faster</tspan><tspan class="f" dx="8">✗ reverted</tspan></text>
<text class="t" x="218" y="239.0" font-size="13" font-weight="600" text-anchor="end">unchecked trie steps</text>
<text class="m" x="218" y="253.0" font-size="10" text-anchor="end">b1b1b4e · fast</text>
<rect class="best" x="230" y="226" width="140.6" height="24" rx="3"/>
<text class="t" x="378.6" y="242.0" font-size="13">5.55 s<tspan class="x" dx="8">2.57× faster</tspan><tspan class="cur" dx="8">◀ current</tspan></text>
</svg>
