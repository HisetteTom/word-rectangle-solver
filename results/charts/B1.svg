<svg xmlns="http://www.w3.org/2000/svg" width="790" height="300" viewBox="0 0 790 300" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
  .bg{fill:#ffffff} .t{fill:#1f2328} .m{fill:#59636e} .g{stroke:#d1d9e0}
  .bar{fill:#8fb8de} .best{fill:#1f6feb} .x{fill:#1a7f37;font-weight:600}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .t{fill:#e6edf3} .m{fill:#9198a1} .g{stroke:#30363d}
    .bar{fill:#2f5f8f} .best{fill:#4493f8} .x{fill:#3fb950}
  }
</style>
<rect class="bg" width="790" height="300" rx="8"/>
<text class="t" x="20" y="30" font-size="17" font-weight="700">B1 · count all 3×3 (exhaustive)</text>
<text class="m" x="20" y="50" font-size="12">search time, log scale · shorter is better · speedup vs naive</text>
<line class="g" x1="200.0" x2="200.0" y1="60" y2="272" stroke-dasharray="2 3"/>
<text class="m" x="200.0" y="288" font-size="11" text-anchor="middle">10 ms</text>
<line class="g" x1="295.0" x2="295.0" y1="60" y2="272" stroke-dasharray="2 3"/>
<text class="m" x="295.0" y="288" font-size="11" text-anchor="middle">100 ms</text>
<line class="g" x1="390.0" x2="390.0" y1="60" y2="272" stroke-dasharray="2 3"/>
<text class="m" x="390.0" y="288" font-size="11" text-anchor="middle">1 s</text>
<line class="g" x1="485.0" x2="485.0" y1="60" y2="272" stroke-dasharray="2 3"/>
<text class="m" x="485.0" y="288" font-size="11" text-anchor="middle">10 s</text>
<line class="g" x1="580.0" x2="580.0" y1="60" y2="272" stroke-dasharray="2 3"/>
<text class="m" x="580.0" y="288" font-size="11" text-anchor="middle">100 s</text>
<text class="t" x="188" y="79.0" font-size="13" font-weight="600" text-anchor="end">naive</text>
<text class="m" x="188" y="93.0" font-size="10" text-anchor="end">60c0927 · fast</text>
<rect class="bar" x="200" y="66" width="292.0" height="24" rx="3"/>
<text class="t" x="500.0" y="82.0" font-size="13">11.9 s<tspan class="m" dx="8">baseline</tspan></text>
<text class="t" x="188" y="119.0" font-size="13" font-weight="600" text-anchor="end">trie + masks</text>
<text class="m" x="188" y="133.0" font-size="10" text-anchor="end">60c0927 · fast</text>
<rect class="bar" x="200" y="106" width="84.3" height="24" rx="3"/>
<text class="t" x="292.3" y="122.0" font-size="13">77.1 ms<tspan class="x" dx="8">154× faster</tspan></text>
<text class="t" x="188" y="159.0" font-size="13" font-weight="600" text-anchor="end">compact trie</text>
<text class="m" x="188" y="173.0" font-size="10" text-anchor="end">d3df964 · fast</text>
<rect class="bar" x="200" y="146" width="82.5" height="24" rx="3"/>
<text class="t" x="290.5" y="162.0" font-size="13">73.9 ms<tspan class="x" dx="8">160× faster</tspan></text>
<text class="t" x="188" y="199.0" font-size="13" font-weight="600" text-anchor="end">staircase MRV (failed)</text>
<text class="m" x="188" y="213.0" font-size="10" text-anchor="end">072145f · fast</text>
<rect class="bar" x="200" y="186" width="91.0" height="24" rx="3"/>
<text class="t" x="299.0" y="202.0" font-size="13">90.7 ms<tspan class="x" dx="8">131× faster</tspan></text>
<text class="t" x="188" y="239.0" font-size="13" font-weight="600" text-anchor="end">leaf counting</text>
<text class="m" x="188" y="253.0" font-size="10" text-anchor="end">e12b165 · fast</text>
<rect class="best" x="200" y="226" width="47.4" height="24" rx="3"/>
<text class="t" x="255.4" y="242.0" font-size="13">31.5 ms<tspan class="x" dx="8">376× faster</tspan></text>
</svg>
