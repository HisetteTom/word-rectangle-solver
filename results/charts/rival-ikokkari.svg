<svg xmlns="http://www.w3.org/2000/svg" width="860" height="496" viewBox="0 0 860 496" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
  .bg{fill:#ffffff} .t{fill:#1f2328} .m{fill:#59636e} .g{stroke:#d1d9e0}
