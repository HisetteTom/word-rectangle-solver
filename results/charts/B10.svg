<svg xmlns="http://www.w3.org/2000/svg" width="790" height="180" viewBox="0 0 790 180" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<style>
  .bg{fill:#ffffff} .t{fill:#1f2328} .m{fill:#59636e} .g{stroke:#d1d9e0}
  .bar{fill:#8fb8de} .best{fill:#1f6feb} .x{fill:#1a7f37;font-weight:600}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .t{fill:#e6edf3} .m{fill:#9198a1} .g{stroke:#30363d}
    .bar{fill:#2f5f8f} .best{fill:#4493f8} .x{fill:#3fb950}
  }
</style>
<rect class="bg" width="790" height="180" rx="8"/>
<text class="t" x="20" y="30" font-size="17" font-weight="700">B10 · count all 5×5 (exhaustive)</text>
<text class="m" x="20" y="50" font-size="12">search time · shorter is better · speedup vs by-value node kernel</text>
<line class="g" x1="200.0" x2="200.0" y1="60" y2="152" stroke-dasharray="2 3"/>
<text class="m" x="200.0" y="168" font-size="11" text-anchor="middle">0</text>
<line class="g" x1="295.0" x2="295.0" y1="60" y2="152" stroke-dasharray="2 3"/>
<text class="m" x="295.0" y="168" font-size="11" text-anchor="middle">10 s</text>
<line class="g" x1="390.0" x2="390.0" y1="60" y2="152" stroke-dasharray="2 3"/>
<text class="m" x="390.0" y="168" font-size="11" text-anchor="middle">20 s</text>
<line class="g" x1="485.0" x2="485.0" y1="60" y2="152" stroke-dasharray="2 3"/>
<text class="m" x="485.0" y="168" font-size="11" text-anchor="middle">30 s</text>
<line class="g" x1="580.0" x2="580.0" y1="60" y2="152" stroke-dasharray="2 3"/>
<text class="m" x="580.0" y="168" font-size="11" text-anchor="middle">40 s</text>
<text class="t" x="188" y="79.0" font-size="13" font-weight="600" text-anchor="end">by-value node kernel</text>
<text class="m" x="188" y="93.0" font-size="10" text-anchor="end">1449b66 · fast</text>
<rect class="best" x="200" y="66" width="290.8" height="24" rx="3"/>
<text class="t" x="498.8" y="82.0" font-size="13">30.6 s<tspan class="m" dx="8">baseline</tspan></text>
<text class="t" x="188" y="119.0" font-size="13" font-weight="600" text-anchor="end">last-row count kernel</text>
<text class="m" x="188" y="133.0" font-size="10" text-anchor="end">04bbb6c · fast</text>
<rect class="bar" x="200" y="106" width="293.4" height="24" rx="3"/>
<text class="t" x="501.4" y="122.0" font-size="13">30.9 s<tspan class="x" dx="8">0.99× faster</tspan></text>
</svg>
